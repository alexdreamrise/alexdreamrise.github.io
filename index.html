<!doctype html>
<html lang="uk">
<head>

<style>
  :root { --text:#fff; --muted:rgba(255,255,255,.72); --glass:rgba(255,255,255,.12); --line:rgba(255,255,255,.22); --accent:#FFB45C; --bg:#0b0c0e; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  .hero { position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:flex-end; padding:0 20px calc(28px + env(safe-area-inset-bottom)); overflow:hidden }
  .hero video, .hero img.poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; transform:scale(1.06); animation:drift 18s ease-in-out infinite alternate }
  @keyframes drift { to { transform:scale(1.14) translateY(-2%) } }
  .hero::after { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.15) 55%,rgba(11,12,14,.96) 100%) }
  .wrap { position:relative; z-index:2; width:100%; max-width:460px; margin:0 auto }
  .tag { display:inline-flex; gap:8px; align-items:center; padding:7px 14px; border-radius:40px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-size:13px; letter-spacing:.3px; opacity:0; animation:up .8s .2s forwards }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 2s infinite }
  @keyframes pulse { 50% { opacity:.35 } }
  h1 { font-family:Unbounded,Inter,sans-serif; font-weight:800; font-size:clamp(54px,17vw,84px); line-height:.92; letter-spacing:-1px; margin:16px 0 10px }
  h1 span { display:inline-block; opacity:0; transform:translateY(40px) rotateX(70deg); animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards }
  @keyframes letter { to { opacity:1; transform:none } }
  .sub { color:var(--muted); font-size:16px; line-height:1.45; margin-bottom:22px; opacity:0; animation:up .8s .9s forwards }
  .sub b { color:#fff; font-weight:600 }
  @keyframes up { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
  .links { display:grid; gap:10px }
  .btn { display:flex; align-items:center; gap:14px; padding:15px 18px; border-radius:18px; text-decoration:none; color:#fff; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); font-weight:600; font-size:16px; opacity:0; animation:up .7s forwards; transition:transform .2s, background .2s }
  .btn:active, .btn:hover { transform:scale(.98); background:rgba(255,255,255,.2) }
  .btn svg { width:24px; height:24px; flex:none }
  .btn small { margin-left:auto; color:var(--muted); font-weight:400; font-size:13px }
  .btn.main { background:#fff; color:#111; border-color:#fff }
  .btn.main small { color:#555 }
  .btn.soon { opacity:.55 !important; pointer-events:none }
  section { max-width:460px; margin:0 auto; padding:34px 20px 50px }
  h2 { font-family:Unbounded,Inter,sans-serif; font-weight:500; font-size:18px; margin-bottom:14px }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
  .grid video { width:100%; aspect-ratio:9/16; object-fit:cover; border-radius:14px; background:#1a1b1e; display:block }
  footer { text-align:center; color:rgba(255,255,255,.4); font-size:12px; padding:0 20px 34px }
  @media (prefers-reduced-motion:reduce) { *{ animation:none !important; opacity:1 !important; transform:none !important } }
</style>
</head>

          Instagram <small>@alexdreamrise</small></a>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16.5 11.2c-.4-2.6-2.2-3.7-4.4-3.7-2.4 0-4 1.6-4 3.3 0 1.8 1.6 2.7 3.5 2.7 2.4 0 3.9-1.3 3.9-4.4 0-3.9-2.7-6.1-6-6.1C5.9 3 3.5 6.6 3.5 12s2.4 9 7.9 9c3.4 0 5.6-1.5 6.6-3.8"/></svg>

</html>
